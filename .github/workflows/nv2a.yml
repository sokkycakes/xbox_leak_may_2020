name: NV2A regression
on:
  push:
    branches: [claude/project-thread-zvdmzt]
    paths: ['xbcompat/**', '.github/workflows/nv2a.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  nv2a:
    runs-on: ubuntu-24.04
    container: debian:bookworm
    timeout-minutes: 25
    env:
      LIBGL_ALWAYS_SOFTWARE: '1'
    steps:
      - name: Install i386 build and rendering dependencies
        run: |
          dpkg --add-architecture i386
          apt-get update
          apt-get install -y git ca-certificates make python3 gcc-i686-linux-gnu libc6-dev-i386-cross pkg-config libsdl2-dev:i386 libgl-dev:i386 xvfb xauth
      - uses: actions/checkout@v4
        with:
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /xbcompat/
            /xbox_leak_may_2020/xbox trunk/xbox/private/ntos/init/ntoskrnl.src
      - name: Controller reports and button edges
        working-directory: xbcompat
        run: |
          mkdir -p build-input
          i686-linux-gnu-gcc -no-pie -fno-pie -std=gnu11 -Wall -Isrc $(env PKG_CONFIG_LIBDIR=/usr/lib/i386-linux-gnu/pkgconfig pkg-config --cflags sdl2) -o build-input/xinput-test tests/xinput_test.c $(env PKG_CONFIG_LIBDIR=/usr/lib/i386-linux-gnu/pkgconfig pkg-config --libs sdl2) -lpthread
          SDL_VIDEODRIVER=dummy build-input/xinput-test
      - name: Controller tests with the Sion SDL version
        working-directory: xbcompat
        run: |
          git clone --depth 1 --branch release-2.32.10 https://github.com/libsdl-org/SDL.git build-input/SDL
          mkdir -p build-input/SDL/build
          cd build-input/SDL/build
          CC=i686-linux-gnu-gcc PKG_CONFIG_LIBDIR=/usr/lib/i386-linux-gnu/pkgconfig ../configure --host=i686-linux-gnu --prefix="$PWD/install" --disable-shared --enable-static --disable-video --disable-audio --disable-render --disable-haptic
          make -j4
          make install
          cd ../../..
          i686-linux-gnu-gcc -no-pie -fno-pie -std=gnu11 -Wall -Isrc $(build-input/SDL/build/install/bin/sdl2-config --cflags) -o build-input/xinput-sion-test tests/xinput_test.c $(build-input/SDL/build/install/bin/sdl2-config --static-libs) -lpthread
          SDL_VIDEODRIVER=dummy build-input/xinput-sion-test
      - name: Shader and texture tests
        working-directory: xbcompat
        run: make -f tools/nv2a-check.mk -j4 CC=i686-linux-gnu-gcc PKGCFG='env PKG_CONFIG_LIBDIR=/usr/lib/i386-linux-gnu/pkgconfig pkg-config' check
      - name: Native renderer ABI and rendering tests
        working-directory: xbcompat
        run: make -f tools/native-renderer.mk TARGET=i386 BUILD=build-nv2a -j4 check check-render
      - name: Full native executable build
        working-directory: xbcompat
        run: make -j4 TARGET=i386 CC=i686-linux-gnu-gcc BUILD=build-native-nv2a PKGCFG='env PKG_CONFIG_LIBDIR=/usr/lib/i386-linux-gnu/pkgconfig pkg-config'
  armhf-build:
    runs-on: ubuntu-24.04
    container: debian:bookworm
    timeout-minutes: 25
    steps:
      - name: Install ARM renderer build dependencies
        run: |
          dpkg --add-architecture armhf
          apt-get update
          apt-get install -y git ca-certificates make python3 gcc-arm-linux-gnueabihf libc6-dev-armhf-cross pkg-config libsdl2-dev:armhf libgl-dev:armhf qemu-user
      - uses: actions/checkout@v4
        with:
          sparse-checkout: xbcompat
      - name: Build ARM renderer and generated ABI adapters
        working-directory: xbcompat
        run: make -f tools/native-renderer.mk TARGET=armhf BUILD=build-renderer-armhf -j4
      - name: ARM controller reports and button edges
        working-directory: xbcompat
        run: |
          mkdir -p build-input-armhf
          arm-linux-gnueabihf-gcc -no-pie -fno-pie -fsigned-char -std=gnu11 -Wall -Isrc $(env PKG_CONFIG_LIBDIR=/usr/lib/arm-linux-gnueabihf/pkgconfig pkg-config --cflags sdl2) -o build-input-armhf/xinput-test tests/xinput_test.c $(env PKG_CONFIG_LIBDIR=/usr/lib/arm-linux-gnueabihf/pkgconfig pkg-config --libs sdl2) -lpthread
          SDL_VIDEODRIVER=dummy qemu-arm -L /usr/arm-linux-gnueabihf build-input-armhf/xinput-test
