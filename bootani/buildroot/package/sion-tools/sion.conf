# Sion settings, read at every boot. Edit on any PC; Windows line endings are fine.
#
# Wi-Fi to join (WPA2/WPA3, or leave WIFI_PASSWORD empty for an open network).
# Wired Ethernet and USB Ethernet adapters work with no settings.
WIFI_SSID=""
WIFI_PASSWORD=""
# Two-letter country code, for the right Wi-Fi channels (e.g. US, GB, DE).
WIFI_COUNTRY=""
# A fixed address on the Wi-Fi network (empty = ask the router over DHCP).
# The gateway defaults to x.x.x.1 and DNS to the gateway.
WIFI_ADDRESS=""
WIFI_GATEWAY=""
WIFI_DNS=""

# Log in over SSH as root with this password, e.g. ssh root@sion.local
# (use single quotes instead if the password has a $, " or \ in it).
# Or leave it empty and put SSH public keys in authorized_keys (next to this file).
PASSWORD=""

# The machine's name on the network: <HOSTNAME>.local
HOSTNAME="sion"

# SSH=no turns the SSH server off.
SSH="yes"

# The dashboard after the boot animation: "xbox" for the Xbox's own
# dashboard under xbcompat, "theseus" for Theseus. Empty = the image's default.
DASHBOARD=""
