# A USB stick image:
#   1  SIONBOOT, the EFI system partition: the kernel (with the root
#      filesystem inside it) as the default UEFI boot loader, plus the
#      settings and test folders a PC can edit (sion/, theseus/). It has
#      room for three images, for A/B updates (sion update).
#   2  SIONDATA, ext4 on /data, grown on first boot to fill the stick, up to 16 GiB.
image efi-part.vfat {
	vfat {
		label = "SIONBOOT"
		file EFI/BOOT/BOOTX64.EFI {
			image = "bzImage"
		}
		file theseus/README.txt {
			image = "theseus-README.txt"
		}
		file sion/README.txt {
			image = "sion-README.txt"
		}
		file sion/sion.conf {
			image = "sion.conf"
		}
		file sion/authorized_keys {
			image = "authorized_keys"
		}
	}
	size = 1024M
}

image data.ext4 {
	ext4 {
		label = "SIONDATA"
		use-mke2fs = true
		# 4 KiB blocks, so growing it on first boot stays a small resize.
		extraargs = "-b 4096"
	}
	empty = true
	size = 64M
}

image bootani-usb.img {
	hdimage {
		partition-table-type = "gpt"
	}
	partition boot {
		image = "efi-part.vfat"
		partition-type-uuid = U
		bootable = true
	}
	partition data {
		image = "data.ext4"
		partition-type-uuid = L
	}
}
